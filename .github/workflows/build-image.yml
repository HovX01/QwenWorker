name: Build worker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - worker.py
      - test_worker.py
      - test_input.json
      - .dockerignore
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: worker-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      WORKER_IMAGE: ghcr.io/hovx01/qwenworker
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check worker
        run: |
          python3 -m venv /tmp/worker-checks
          /tmp/worker-checks/bin/pip install --no-cache-dir -r requirements.txt
          /tmp/worker-checks/bin/python -m unittest -v test_worker.py
      - name: Free build space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Build and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --progress=plain \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${WORKER_IMAGE}:${GITHUB_SHA}" \
            --tag "${WORKER_IMAGE}:latest" .
          docker push "${WORKER_IMAGE}:${GITHUB_SHA}"
          docker push "${WORKER_IMAGE}:latest"
